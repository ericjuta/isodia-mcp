name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # cf, and Vite with the Cloudflare plugin, run on Node.js 22.18 or later, not on Bun.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Prove the first-use MCP and canvas flow in Chromium
        env:
          CHROME_PATH: /usr/bin/google-chrome
          ISODIA_CHECK_TIMINGS: "1"
        run: bun scripts/onboarding-browser-check.ts
      - name: Prove the article embed in Chromium
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: bun scripts/walkthrough-browser-check.ts
      - name: Prove the built Cloudflare Worker in workerd
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: bun scripts/worker-runtime-check.ts --built
      # Validates the Build Output without credentials or uploads, then reports bundle size and
      # local startup time. Nothing is deployed.
      - name: Validate the Worker build for deployment
        run: |
          ./node_modules/.bin/cf deploy --dry-run --prebuilt --mode production
          ./node_modules/.bin/cf workers check --prebuilt --mode production --outfile "$RUNNER_TEMP/worker-startup.cpuprofile"

  # Builds the reader-only askgina-os-walkthrough Worker with the reviewed publication in
  # deploy/askgina-os-walkthrough and uploads its Build Output. Nothing is deployed.
  askgina-os-walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Pin the reviewed publication
        run: sha256sum -c SHA256SUMS
        working-directory: deploy/askgina-os-walkthrough/publications
      - run: bun run build
      - name: Build and validate the reader Worker for deployment
        working-directory: deploy/askgina-os-walkthrough
        run: |
          ../../node_modules/.bin/cf build
          ../../node_modules/.bin/cf deploy --dry-run --prebuilt
          ../../node_modules/.bin/cf workers check --prebuilt
          find .cloudflare/output -type f | sort | xargs sha256sum
      - uses: actions/upload-artifact@v4
        with:
          name: askgina-os-walkthrough-build-output
          path: deploy/askgina-os-walkthrough/.cloudflare/output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
